[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-flow-backend-a"
version = "0.10.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3", "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_POSTGRES_URL pointing to an empty disposable PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
